

# -----------------------------------------------------
# Pywal Theme Integration
# -----------------------------------------------------
; include=~/.cache/wal/colors-foot.ini

# -----------------------------------------------------
# Shell
# -----------------------------------------------------
shell=/usr/bin/zsh
term=foot

# -----------------------------------------------------
# Font
# -----------------------------------------------------
font=JetBrainsMono Nerd Font:size=12
font-bold=JetBrainsMono Nerd Font:style=Bold:size=12
font-italic=JetBrainsMono Nerd Font:style=Italic:size=12
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=12

# -----------------------------------------------------
# Window
# -----------------------------------------------------
pad=24x24
resize-delay-ms=100

# -----------------------------------------------------
# Cursor
# -----------------------------------------------------
[cursor]
style=block
blink=yes
beam-thickness=1.5

# -----------------------------------------------------
# Scrollback
# -----------------------------------------------------
[scrollback]
lines=50000

# -----------------------------------------------------
# Mouse
# -----------------------------------------------------
[mouse]
hide-when-typing=yes

# -----------------------------------------------------
# URL
# -----------------------------------------------------
[url]
launch=xdg-open ${url}
label-letters=arstneio

# -----------------------------------------------------
# Colors
# -----------------------------------------------------
[colors]
alpha=1.0
alpha-mode=default

# -----------------------------------------------------
# Key bindings
# -----------------------------------------------------
[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert
```

## 3. Kitty to Foot feature mapping

| Kitty setting | Foot equivalent |
|---|---|
| Pywal include | `include=...colors-foot.ini` |
| Zsh shell | `shell=/usr/bin/zsh` |
| JetBrains Mono | `font=...` |
| Font size 12 | `size=12` |
| Background opacity 1 | `alpha=1.0` |
| Window padding 24 | `pad=24x24` |
| Block cursor | `style=block` |
| Cursor blinking | `blink=yes` |
| Curly URL style | No exact equivalent |
| Clickable URLs | `[url] launch=...` |
| Audio bell disabled | Foot has its own bell settings |
| Cursor trail | No native equivalent |
| Remote control | No direct equivalent |

**Important:** Foot does not support Kitty's cursor trail animation. Its cursor and rendering behavior are different.

## 4. Configure Pywal integration

Your Kitty configuration currently uses:

```text
~/.config/kitty/themes/pywal.conf
```

Foot needs its own color configuration.

If you use pywal16, you can generate a Foot-compatible file from its palette.

Create:

```bash
mkdir -p ~/.config/wal/templates
nvim ~/.config/wal/templates/colors-foot.ini
```

Paste:

<CodeBlock language="ini" editable>
[colors]
foreground={foreground}
background={background}
regular0={color0}
regular1={color1}
regular2={color2}
regular3={color3}
regular4={color4}
regular5={color5}
regular6={color6}
regular7={color7}
bright0={color8}
bright1={color9}
bright2={color10}
bright3={color11}
bright4={color12}
bright5={color13}
bright6={color14}
bright7={color15}
alpha=1.0
